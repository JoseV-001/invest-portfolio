spring:
  application:
    name: invest-portfolio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:sqlite}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002}
  providers:
    brapi:
      base-url: https://brapi.dev/api
      token: ${BRAPI_TOKEN:${BRAPI_API_TOKEN:}}
      min-interval-ms: ${BRAPI_MIN_INTERVAL_MS:400}
    finnhub:
      base-url: https://finnhub.io/api/v1
      token: ${FINNHUB_API_KEY:}
    awesomeapi:
      base-url: https://economia.awesomeapi.com.br/last
  trading-agents:
    base-url: ${TRADING_AGENTS_API_URL:http://localhost:8000}
    connect-timeout-seconds: 10
    read-timeout-seconds: 180
